<div class="max-w-7xl mx-auto">
  <app-page-header
    title="Panel de"
    highlight="Administración"
    subtitle="Gestiona los usuarios, roles y configuraciones críticas del sistema."
  />

  <!-- Cuadrilla de opciones -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
    <app-grid-menu-card
      label="Usuarios"
      description="Gestión integral de usuarios, creación, edición y control de accesos al sistema."
      icon="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
      [routerLink]="'/home/administrador/usuarios'"
    />

    <app-grid-menu-card
      label="Reportes"
      description="Visualiza y exporta informes detallados de la actividad y estadísticas del sistema."
      icon="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
      [routerLink]="'/home/administrator/reportes'"
    />

    <app-grid-menu-card
      label="Auditoría"
      description="Registro histórico de todas las acciones realizadas por los usuarios para seguridad."
      icon="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
      route="/home/administrator/auditoria"
    />

    <app-grid-menu-card
      label="Roles y Permisos"
      description="Configura los niveles de acceso y responsabilidades para cada tipo de usuario."
      icon="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
      route="/home/administrator/roles"
    />

    <app-grid-menu-card
      label="Configuración Global"
      description="Ajustes generales del sistema, parámetros de red y preferencias globales."
      icon="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
      route="/home/administrator/configuracion"
    />
  </div>

  <app-menu-options-modal
    #userModal
    title="Gestión de Usuarios"
    icon="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
    [options]="userOptions"
  />
</div>
