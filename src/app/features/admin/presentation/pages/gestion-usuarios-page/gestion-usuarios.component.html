<div class="max-w-7xl mx-auto p-4">
  <app-page-header
    title="Gestión de"
    highlight="Usuarios"
    subtitle="Listado y administración de los usuarios del sistema."
    [showBackButton]="true"
  >
  </app-page-header>

  <!-- Loading State -->
  @if (isLoading()) {
    <div class="flex justify-center p-12">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  } @else if (errorMessage()) {
    <!-- Error State -->
    <div class="alert alert-error shadow-lg rounded-2xl">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="stroke-current shrink-0 h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  } @else {
    <!-- Table -->
    <div class="bg-base-100 rounded-3xl shadow-xl border border-base-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="table table-zebra w-full">
          <!-- head -->
          <thead class="bg-base-200/50 text-base-content text-sm">
            <tr>
              <th class="py-4">Usuario</th>
              <th>Correo</th>
              <th>Roles</th>
              <th>Estado</th>
              <th class="py-4">
                <div class="flex items-center justify-center gap-2.5">
                  <span>Acciones</span>
                  <button
                    (click)="openModal()"
                    class="btn btn-primary btn-xs btn-circle shadow-md hover:scale-110 active:scale-90 transition-all border-none"
                    title="Nuevo Usuario"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-3 w-3"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="3"
                    >
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                  </button>
                </div>
              </th>
            </tr>
          </thead>
          <tbody>
            @for (user of users(); track user.id) {
              <tr
                app-user-table-row
                [user]="user"
                (edit)="onEditUser($event)"
                (delete)="onDeleteUser($event)"
                class="hover:bg-base-200/50 transition-colors"
              ></tr>
            }
            @if (users().length === 0) {
              <tr>
                <td colspan="5" class="text-center py-12 text-base-content/60">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-12 w-12 mx-auto mb-4 opacity-50"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                    />
                  </svg>
                  No se encontraron usuarios en la base de datos.
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <app-user-pagination
        [currentPage]="currentPage()"
        [totalItems]="totalUsers()"
        [itemsPerPage]="limit()"
        (pageChange)="changePage($event)"
      />
    </div>
  }

  <app-add-user-form
    [isOpen]="isModalOpen()"
    [userToEdit]="userToEdit()"
    (close)="closeModal()"
    (userAdded)="loadUsers()"
  />
</div>
