<dialog id="menu_options_modal" class="modal modal-bottom sm:modal-middle">
  <div
    class="modal-box bg-base-100 p-0 overflow-hidden rounded-3xl border border-base-200 shadow-2xl max-w-lg relative"
  >
    <!-- Close Button (Top-Right) -->
    <form method="dialog">
      <button
        class="btn btn-circle btn-ghost btn-sm absolute right-4 top-4 z-20 text-primary hover:bg-primary/10"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </form>

    <!-- Header with large icon and title -->
    <div
      class="bg-linear-to-br from-primary/10 to-transparent p-10 flex flex-col items-center border-b border-base-200"
    >
      <div class="p-5 rounded-3xl bg-primary text-primary-content shadow-lg mb-6">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-16 w-16"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icon()" />
        </svg>
      </div>
      <h2 class="text-3xl font-black text-base-content tracking-tight text-center">
        {{ title() }}
      </h2>
    </div>

    <!-- Options List -->
    <div class="p-6 space-y-3 max-h-[60vh] overflow-y-auto mb-4">
      @for (option of options(); track option.route) {
        <a
          [routerLink]="option.route"
          (click)="closeModal()"
          class="flex items-center gap-5 p-4 rounded-2xl hover:bg-base-200 transition-all duration-200 group border border-transparent hover:border-base-300"
        >
          <div
            class="p-3 rounded-xl bg-base-200 text-primary group-hover:bg-primary group-hover:text-primary-content transition-colors duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="option.icon" />
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-base-content group-hover:text-primary transition-colors">
              {{ option.label }}
            </span>
            <span class="text-xs text-base-content/60 line-clamp-1">
              {{ option.description }}
            </span>
          </div>
          <div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-primary"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </div>
        </a>
      }
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
