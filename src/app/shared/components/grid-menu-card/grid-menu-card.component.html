<a
  [routerLink]="route()"
  (click)="onCardClick($event)"
  class="group relative flex flex-col items-center justify-center p-8 bg-base-100 border border-base-200 rounded-3xl transition-all duration-300 hover:shadow-2xl hover:shadow-primary/10 hover:-translate-y-2 hover:border-primary/30 overflow-hidden"
>
  <!-- Background Glow Effect -->
  <div
    class="absolute inset-0 bg-linear-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"
  ></div>

  <!-- Icon Container -->
  <div
    class="mb-6 p-4 rounded-2xl bg-base-200 text-primary group-hover:bg-primary group-hover:text-primary-content transition-colors duration-300 shadow-inner"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-10 w-10"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icon()" />
    </svg>
  </div>

  <!-- Content -->
  <div class="text-center relative z-10">
    <h3
      class="text-xl font-bold text-base-content group-hover:text-primary transition-colors duration-300 mb-2"
    >
      {{ label() }}
    </h3>
    <p class="text-sm text-base-content/60 group-hover:text-base-content/80 line-clamp-2">
      {{ description() }}
    </p>
  </div>

  <!-- Decorative Element -->
  <div
    class="absolute bottom-4 right-4 opacity-0 group-hover:opacity-100 transition-all duration-300 translate-x-4 group-hover:translate-x-0"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5 text-primary"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M13 7l5 5m0 0l-5 5m5-5H6"
      />
    </svg>
  </div>
</a>
