<ul class="menu bg-base-100 text-base-content min-h-full w-80 p-4 border-r border-base-200">
  <!-- Logo y Título -->
  <li class="mb-4 pointer-events-none">
    <div class="flex items-center gap-4">
      <div class="w-20">
        <img src="assets/images/logo.png" alt="SIGA Logo" class="w-full h-auto" />
      </div>
      <h2 class="text-5xl font-black text-primary tracking-tight">SIGA</h2>
    </div>
  </li>

  <!-- Menú de navegación principal -->
  <li class="menu-title text-xs font-bold uppercase tracking-widest text-base-content/50">
    Módulos
  </li>

  @for (item of menuItems(); track item.route) {
    <li>
      <a
        [routerLink]="item.route"
        routerLinkActive="active bg-primary text-primary-content hover:bg-primary/80"
        class="flex items-center gap-3 py-3 rounded-xl transition-all duration-200 hover:bg-base-200"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        <span class="font-medium">{{ item.label }}</span>
      </a>
    </li>
  }

  <!-- Footer del menú / Perfil rápido -->
  <div class="mt-auto pt-6 border-t border-base-200">
    <!-- Información del Usuario -->
    @if (user()) {
      <div class="px-3 py-4 mb-2 flex items-center gap-3 bg-base-200/50 rounded-xl">
        <app-user-avatar [name]="user()?.name!" />
        <div class="flex flex-col overflow-hidden">
          <span class="font-bold text-sm truncate">{{ user()?.name }}</span>
          <span class="text-xs opacity-60 uppercase font-semibold tracking-wider">{{
            adminMapper.getPrettyRole(user()?.role!)
          }}</span>
        </div>
      </div>
    }

    <li>
      <button
        (click)="logout()"
        class="flex w-full items-center gap-3 py-3 rounded-xl text-error hover:bg-error/10 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        <span class="font-bold">Cerrar Sesión</span>
      </button>
    </li>
  </div>
</ul>
